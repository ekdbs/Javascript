<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var person1 = {
            toLocaleString : function(){
                return "Nikolas";
            },
            toString : function(){
                return "Nicholas";
            }
        };

        var person2 = {
            toLocaleString : function(){
                return "Grigorios";
            },
            toString : function(){
                return "Greg";
            }
        };

        var people = [person1, person2];
        alert(people); //암묵적 호출
        alert(people.toString()); //명시적 호출
        alert(people.toLocaleString());
    </script>
</body>
</html>
