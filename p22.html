<!doctype html>
<html>
  <head></head>
  <body>
    <script>
      for (var i = 0; i < 10; i++) {
        if (i === 5) break;
                
        document.write("coding everybody i : " + i + "<br/>");
      }
      
      document.write("-----------------------------<br/>");
      for (var j = 0; j < 10; j++) {
        if (j === 5) {
          continue;
        }
        document.write("coding everybody j : " + j + "<br/>");
      }
    </script>
  </body>
</html>
